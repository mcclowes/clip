name: Check CLIP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cli:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run registry:check
      - run: node packages/cli/dist/main.js schema
      - run: node packages/cli/dist/main.js commands check
      - run: node scripts/package-release.mjs
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: node scripts/site-registry.mjs
      - run: git diff --exit-code -- site/data site/static/registry
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npm run typecheck
        working-directory: site
