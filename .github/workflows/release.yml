name: Release CLI
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No dependency cache in the release job, to avoid cache poisoning.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test && npm run build && npm run registry:check
      - name: Check release version
        run: node -e 'const p=require("./packages/cli/package.json"); if(process.env.GITHUB_REF_NAME!==`v${p.version}`) process.exit(1)'
      - run: node scripts/package-release.mjs
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --verify-tag --notes-file release-notes.md
      # Trusted publishing (OIDC): no npm token is stored in the repository.
      - name: Publish to npm
        working-directory: packages/cli
        run: npm install -g npm@latest && npm publish --provenance
