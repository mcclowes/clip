version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/site']
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      docusaurus:
        patterns: ['@docusaurus/*']
      # react-dom pins an exact react peer; separate bumps fail npm ci.
      react:
        patterns: ['react', 'react-dom']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
