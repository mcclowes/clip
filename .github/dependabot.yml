version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/site']
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      docusaurus:
        patterns: ['@docusaurus/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
