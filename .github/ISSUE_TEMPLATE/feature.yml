name: Feature request
description: Suggest a change to the CLI, the schema format, or generated skills.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do and why CLIP gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd like CLIP to do. Note any change to the schema format or generated skill output.
